# Supabase 무료 프로젝트가 활동 없음으로 일시정지되지 않도록 3일마다 읽기 요청을 보낸다.
# (공개용 publishable 키만 사용, 데이터는 읽기만 한다)
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read daily ranking and forge match
        env:
          URL: https://wkyqotnysmuzjgwlbnlf.supabase.co/rest/v1/rpc
          KEY: sb_publishable__JtY-5lIILQt-cjrvVyw0A_VZrSQdsR
        run: |
          set -e
          DAY=$(TZ=Asia/Seoul date +%F)
          curl -sf -X POST "$URL/daily_top" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"p_day\":\"$DAY\",\"p_limit\":1}"
          echo
          curl -sf -X POST "$URL/forge_match" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{"p_device":"keepalive-bot-0000","p_level":5}'
          echo
